server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Eleventy pretty URLs: /consulting/ -> /consulting/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # cache-busted assets live long; html stays fresh
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store";
    }
}
