# Perception Agent — Autonomous content analysis loop
# Runs every 6 hours via CI cron or Zedra daemon trigger
apiVersion: effusion.io/v1
kind: Agent
metadata:
  name: perception-agent
  namespace: effusion-labs
spec:
  schedule: "0 */6 * * *"
  lenses:
    - stylometric
    - osint
    - cryptographic
    - ast_dependency
    - strata_debt
    - temporal_drift
    - probabilistic
  triggers:
    - type: build
      condition: lens_drift_detected
      action: swarm_reanalysis
    - type: ast
      condition: circular_dependency_detected
      action: alert_and_block
    - type: temporal
      condition: major_drift_detected
      action: notify_and_snapshot
    - type: probabilistic
      condition: brittleness_high
      action: flag_for_review
    - type: commit
      condition: auto_commit_enabled
      branch: main
  outputs:
    - path: src/_data/lensManifest.json
    - path: docs/competitive-intel/latest.md
  env:
    - name: GITHUB_TOKEN
      valueFrom: env
    - name: LENS_ENABLED
      value: "true"
    - name: LENS_SWARM_CONCURRENCY
      value: "16"
